name: CI

on:
  push:
    branches: [main, "feature/*", "docs/*", "setup/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install polars networkx torch --quiet
      - name: Lint
        run: |
          ruff check ghostforge tests || true
          black --check ghostforge tests || true
      - name: Test
        run: |
          pytest -o addopts="" -q
      - name: Build Docker
        run: |
          docker build -t ghostforge:test .

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run benchmark
        run: |
          pip install -e ".[dev]"
          python scripts/benchmark.py --out benchmarks
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/report.*
