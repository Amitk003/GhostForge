[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostforge"
version = "0.1.0"
description = "AI based network attack forecasting from traffic telemetry using temporal graph world models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["cybersecurity", "ids", "world-model", "graph-neural-network", "mitre-attck"]
authors = [{ name = "GhostForge Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.35",
  "python-multipart>=0.0.9",
  "duckdb>=0.10",
  "networkx>=3.3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "pytorch-lightning>=2.2",
]
pcap = [
  "scapy>=2.5",
  "dpkt>=1.9",
]
explain = [
  "shap>=0.44",
  "captum>=0.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "httpx-sse>=0.4",
]

[project.urls]
Homepage = "https://github.com/Amitk003/GhostForge"
Repository = "https://github.com/Amitk003/GhostForge"
Issues = "https://github.com/Amitk003/GhostForge/issues"

[project.scripts]
ghostforge = "ghostforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ghostforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=ghostforge --cov-report=term-missing"

[tool.coverage.run]
source = ["ghostforge"]
omit = ["tests/*"]
